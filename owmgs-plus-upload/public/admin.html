<style>
/* Layout: control desk — navy top bar with tabs, one working column: list of items, or the editor for one item. */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#0d1b33; --muted:#53627a; --line:#dbe2ec;
  --navy:#0e1f3d; --navy-ink:#eef3fb; --cyan:#0aa6d6; --orange:#f07d1a; --green:#3bb273; --red:#d64545;
  --cyan-soft:#e3f5fb; --orange-soft:#fdeedd; --green-soft:#e2f5ea;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#08111f; --surface:#101c31; --ink:#e8eef8; --muted:#9aaac2; --line:#22324d;
  --navy:#050c18; --cyan:#3cc3ee; --orange:#ff9a45; --green:#5fd394; --red:#ff7676;
  --cyan-soft:#0f2b3c; --orange-soft:#33220f; --green-soft:#0f2a1c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.bar img{width:38px;height:38px}
.bar h1{font-size:18px}
.bar small{display:block;font-family:var(--body);font-size:12px;font-weight:500;opacity:.7}
.bar .sp{flex:1}
.bar a,.bar button{min-height:40px;display:inline-flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--navy-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.bar a,.bar button{white-space:nowrap}
@media (max-width:480px){.bar small{display:none}.bar h1{font-size:16px}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;color:rgba(238,243,251,.7);padding:10px 16px;min-height:44px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--cyan);color:#021620}

main{padding-block:24px 80px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h2{font-size:26px;flex:1;min-width:0}
.help{color:var(--muted);font-size:14.5px;margin:0 0 16px;max-width:70ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.b-main{background:var(--orange);color:#1b0e02}
.b-cyan{background:var(--cyan);color:#021620}
.b-line{background:var(--surface);border:1.5px solid var(--line)}
.b-red{background:transparent;color:var(--red);border:1.5px solid var(--line)}
.search{width:100%;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}

/* list */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--bg);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden}
.item b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt{font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.c-live{background:var(--green-soft);color:var(--green)}
.c-hid{background:var(--orange-soft);color:var(--orange)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button,.acts a{padding:0 14px;min-height:42px;font-size:14px}
@media (max-width:620px){
  .item{grid-template-columns:52px minmax(0,1fr)}
  .thumb{width:52px;height:52px}
  .acts{grid-column:1/-1;justify-content:flex-start}
}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted)}

/* editor */
.editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:700;font-size:14px}
.hint{font-size:12.5px;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=date],.field input[type=number],.field select,.field textarea,.login input{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.field textarea{min-height:160px;resize:vertical}
.media{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:520px){.media{grid-template-columns:1fr}}
.prev{width:100%;aspect-ratio:4/3;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12.5px;text-align:center;padding:6px}
.prev img{width:100%;height:100%;object-fit:cover}
.up{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up input[type=file]{display:none}
.prog{font-size:13px;color:var(--cyan);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.foot{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.group{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.group h3{font-size:17px}

/* login */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px;text-align:center}
.login img{width:84px;margin:0 auto}
.login h1{font-size:24px}
.err{color:var(--red);font-size:14px;min-height:1.3em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.done-img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.live{font-size:14px;line-height:1.5}
.live.ok{color:var(--green)}
.live.bad{color:var(--orange);font-weight:600}
@media (max-width:520px){.head h2{flex-basis:100%}.head .btn{flex:1 1 auto}}
.ico{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em;fill:currentColor}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs .ico{width:17px;height:17px}
.btn .ico{width:17px;height:17px}
.c-bot{background:var(--cyan-soft);color:var(--cyan)}
.b-ok{background:var(--green);color:#03170b}
.waiting{background:var(--cyan-soft);border:1px solid var(--cyan);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:14px}
.done{background:var(--green-soft);border:1px solid var(--green);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:grid;gap:10px;font-size:15px}
.warn{background:var(--orange-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
</style>
</head>

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const main=$("#main");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(d){if(!d)return"";const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function isoDay(d){const x=d?new Date(d):new Date();if(isNaN(x))return"";const z=new Date(x.getTime()-x.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200);}
const ERR={wrong_password:"Wrong password.",locked:"Too many wrong tries. Wait 15 minutes, then try again.",
  change_password:"Change ADMIN_PASSWORD in your Apps Script code first, then deploy a New version.",
  file_too_big:"That file is too big. The limit is 25 MB. For long videos, upload to YouTube and paste the link.",
  not_found:"That item was already removed. The list has been refreshed."};
let PW="";try{PW=sessionStorage.getItem("owmgs_pw")||"";}catch(e){}

async function api(action,payload={}){
  if(!API_URL.startsWith("https://script.google.com/"))throw new Error("API_URL is not set. Paste your Apps Script link at the top of admin.html.");
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,password:PW},payload))});
  let j;try{j=await res.json();}catch(e){throw new Error("The server did not answer properly. Check that the Apps Script is deployed with access: Anyone.");}
  if(!j.ok){
    if(j.error==="wrong_password"){logout();}
    throw new Error(ERR[j.error]||("Error: "+j.error));
  }
  return j;
}

$("#loginForm").addEventListener("submit",async e=>{

  PW=$("#pw").value;
  try{await api("login");try{sessionStorage.setItem("owmgs_pw",PW);}catch(e){}start();}
  catch(err){$("#loginErr").textContent=err.message;}
  b.disabled=false;
});
function logout(){PW="";try{sessionStorage.removeItem("owmgs_pw");}catch(e){}$("#app").hidden=true;$("#loginForm").hidden=false;$("#pw").value="";}
$("#logout").addEventListener("click",logout);

/* ---------------- tabs ---------------- */
let cur=TABS[0],rows=[];
function drawTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t===cur}" data-tab="${t.key}">${ico(TAB_ICON[t.key]||"grid")}${t.label}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;cur=TABS.find(t=>t.key===b.dataset.tab);drawTabs();openTab();});
function start(){$("#loginForm").hidden=true;$("#app").hidden=false;drawTabs();openTab();}

async function openTab(){
  window.scrollTo(0,0);
  main.innerHTML=`<div class="head"><h2>${cur.title}</h2></div><p class="help">${cur.help}</p><div class="empty">Loading…</div>`;
  try{
    if(cur.settings){const j=await api("adminList",{tab:"Settings"});LASTNEWS=j.lastNews||null;drawSettings(j.settings||{});return;}
    const j=await api("adminList",{tab:cur.key});rows=j.rows||[];drawList();
  }catch(err){main.querySelector(".empty").textContent=err.message;}
}

let LASTNEWS=null;
function newsBox(){
  const l=LASTNEWS;
  const last=l?`Last check: ${fmtDate(l.at)} ${new Date(l.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}. ${l.added} new ${l.added===1?"story":"stories"}${l.errors?` (${l.errors} topic${l.errors>1?"s":""} could not be searched)`:""}.`:"The robot has not run yet.";
  return `<div class="up"><button class="btn b-cyan" type="button" data-newsnow>${ico("bot")} Check for news now</button></div><span class="hint" id="newsLast">${esc(last)} Save settings before checking if you changed the mode or topics.</span>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-newsnow]");if(!b)return;
  b.disabled=true;const old=b.innerHTML;b.textContent="🔎 Searching the news… (up to 30 seconds)";
  try{
    const j=await api("newsNow");
    LASTNEWS={at:new Date().toISOString(),added:j.added,errors:j.errors};
    const where=j.mode==="auto"?"They are live on the website.":"They are waiting in News & Blog. Tap “Approve” on the ones you want.";
    toast(j.added?`${j.added} new ${j.added===1?"story":"stories"} added. ${where}`:(j.errors&&j.errors>=j.checked?"Could not reach Google News. Try again later.":"No new stories right now. Try again later."));
    if(cur.key==="Posts"){const r=await api("adminList",{tab:"Posts"});rows=r.rows||[];drawList();}
    else{const n=$("#newsLast");if(n)n.textContent=`Last check: just now. ${j.added} new.`;}
  }catch(err){toast(err.message);}
  if(b.isConnected){b.disabled=false;b.innerHTML=old;}
});
function drawList(q=""){
  let add=(cur.comments||cur.leads)?"":`<button class="btn b-main" type="button" id="addNew">+ Add new</button>`;
  if(cur.key==="Posts")add=`<button class="btn b-cyan" type="button" data-newsnow>${ico("bot")} Check for news now</button>`+add;
  const waiting=cur.key==="Posts"?rows.filter(r=>String(r.auto).toUpperCase()==="YES"&&String(r.show).toUpperCase()==="NO").length:0;
  const filtered=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
  main.innerHTML=`<div class="head"><h2>${cur.title}</h2>${add}</div><p class="help">${cur.help}</p>
   ${waiting?`<div class="waiting">${ico("bot")} <b>${waiting} robot ${waiting===1?"story is":"stories are"} waiting for approval.</b> Read each one, then tap <b>Approve ✓</b> to publish it, or <b>Delete</b>.</div>`:""}
   ${rows.length>5?`<input class="search" id="q" type="search" placeholder="Search…" value="${esc(q)}" aria-label="Search">`:""}
   ${cur.key==="Chat"&&!rows.length?`<div class="waiting">${ico("chat")} Start quickly: <button class="btn b-cyan" type="button" id="chatStarter">${ico("check")} Add the 6 starter answers</button><br><span class="hint">Then edit them: add your prices, hours and anything customers often ask.</span></div>`:""}
   <div class="list">${filtered.length?filtered.map(itemHTML).join(""):`<div class="empty">${rows.length?"Nothing matches your search.":(cur.comments?"No comments yet.":cur.leads?"No WhatsApp requests yet. When customers order or ask for a person through your WhatsApp assistant, they appear here.":"Nothing here yet. Tap “+ Add new” to add the first one.")}</div>`}</div>`;
  const qi=$("#q");if(qi){qi.addEventListener("input",()=>{const v=qi.value;drawList(v);const n=$("#q");n.focus();n.setSelectionRange(v.length,v.length);});}
  const an=$("#addNew");if(an)an.addEventListener("click",()=>edit({}));
  const cs=$("#chatStarter");if(cs)cs.addEventListener("click",async()=>{
    cs.disabled=true;cs.textContent="Adding…";
    try{for(let i=0;i<CHAT_STARTER.length;i++){const c=CHAT_STARTER[i];const j=await api("save",{tab:"Chat",item:{question:c[0],keywords:c[1],answer:c[2],target:c[3],order:String(i+1),show:"YES"}});rows.push(j.item);}
      toast("6 answers added. Edit them to fit your business.");drawList();}
    catch(err){toast(err.message);cs.disabled=false;cs.innerHTML=ico("check")+" Add the 6 starter answers";}
  });
}
function itemHTML(r){
  const hidden=String(r.show).toUpperCase()==="NO";
  const robot=String(r.auto).toUpperCase()==="YES";
  const st=(robot?`<span class="chip c-bot">${ico("bot")} AUTO</span>`:"")+`<span class="chip ${hidden?"c-hid":"c-live"}">${hidden?(robot?"WAITING":"HIDDEN"):"LIVE"}</span>`;
  if(cur.leads){
    const num=String(r.number||"").replace(/\D/g,"");
    return `<div class="item"><div class="thumb">💬</div>
      <div style="min-width:0"><b>${esc(r.name||("+"+num))}</b><div class="sub"><span class="chip ${hidden?"c-live":"c-hid"}">${hidden?"DONE":"NEW"}</span>${esc(r.type)} · ${fmtDate(r.date)}</div><div class="txt">${esc(r.details||"")} ${num?"· +"+esc(num):""}</div></div>
      <div class="acts">${num?`<a class="btn b-ok" href="https://wa.me/${esc(num)}" target="_blank" rel="noopener">Chat ↗</a>`:""}<button class="btn b-line" data-toggle="${esc(r.id)}">${hidden?"Reopen":"Mark done"}</button><button class="btn b-red" data-del="${esc(r.id)}">Delete</button></div></div>`;
  }
  if(cur.comments){
    return `<div class="item"><div class="thumb">${"★".repeat(Number(r.rating)||0)||"—"}</div>
      <div style="min-width:0"><b>${esc(r.name)}</b><div class="sub">${st}${esc(r.about)} · ${fmtDate(r.date)}</div><div class="txt">${esc(r.text)}</div></div>
      <div class="acts"><button class="btn b-line" data-toggle="${esc(r.id)}">${hidden?"Show":"Hide"}</button><button class="btn b-red" data-del="${esc(r.id)}">Delete</button></div></div>`;
  }
  const th=r.image?`<img class="thumb" src="${esc(r.image)}" alt="" loading="lazy" onerror="imgFallback(this)">`:`<div class="thumb">${r.video?"VIDEO":"—"}</div>`;
  return `<div class="item">${th}
    <div style="min-width:0"><b>${esc(r.title||r.question||r.advertiser||"(no title)")}</b><div class="sub">${st}${esc(cur.sub(r))}</div></div>
    <div class="acts">${robot&&/^https?:\/\//i.test(r.link||"")?`<a class="btn b-line" href="${esc(r.link)}" target="_blank" rel="noopener">Read source ↗</a>`:""}${cur.key==="Posts"&&!(robot&&hidden)?`<button class="btn b-line" data-link="${esc(r.id)}">${ico("link")} Link</button>`:""}<button class="btn b-cyan" data-edit="${esc(r.id)}">Edit</button><button class="btn ${hidden&&robot?"b-ok":"b-line"}" data-toggle="${esc(r.id)}">${hidden?(robot?"Approve ✓":"Show"):"Hide"}</button><button class="btn b-red" data-del="${esc(r.id)}">Delete</button></div></div>`;
}
function imgFallback(img){const m=img.src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);if(m&&!img.dataset.fb){img.dataset.fb=1;img.src="https://drive.google.com/thumbnail?id="+m[1]+"&sz=w600";}}

function postLink(id){return new URL("./",location.href).href+"#p-"+String(id).replace(/[^\w-]/g,"");}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Link copied. Paste it in WhatsApp or Facebook.");}catch(e){prompt("Copy this link:",t);}}
main.addEventListener("click",async e=>{
  const lk=e.target.closest("[data-link]");
  if(lk){copyText(postLink(lk.dataset.link));return;}
  const cp=e.target.closest("[data-copylink]");
  if(cp){copyText(cp.dataset.copylink);return;}
  const ed=e.target.closest("[data-edit]");
  if(ed){edit(rows.find(r=>String(r.id)===ed.dataset.edit)||{});return;}
  const tg=e.target.closest("[data-toggle]");
  if(tg){const r=rows.find(x=>String(x.id)===tg.dataset.toggle);if(!r)return;tg.disabled=true;
    const show=String(r.show).toUpperCase()==="NO"?"YES":"NO";
    try{await api("save",{tab:cur.key,item:{id:r.id,show}});r.show=show;toast(show==="YES"?"Now showing on the website":"Hidden from the website");drawList(($("#q")||{}).value||"");}
    catch(err){toast(err.message);tg.disabled=false;}return;}
  const dl=e.target.closest("[data-del]");
  if(dl){
    if(dl.dataset.sure!=="1"){dl.dataset.sure="1";dl.textContent="Tap again to delete";setTimeout(()=>{if(dl.isConnected){dl.dataset.sure="";dl.textContent="Delete";}},4000);return;}
    dl.disabled=true;
    try{await api("delete",{tab:cur.key,id:dl.dataset.del});rows=rows.filter(x=>String(x.id)!==dl.dataset.del);toast("Deleted");drawList(($("#q")||{}).value||"");}
    catch(err){toast(err.message);openTab();}
  }
});

/* ---------------- editor ---------------- */
function fieldHTML(f,v){
  const id="f_"+f.k, val=v??"";
  const hint=f.hint?`<span class="hint">${f.hint}</span>`:"";
  switch(f.t){
    case "select": return `<div class="field"><label for="${id}">${f.l}</label><select id="${id}">${f.o.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${esc(f.ol?f.ol[o]:o)}</option>`).join("")}</select>${hint}</div>`;
    case "textarea": return `<div class="field"><label for="${id}">${f.l}</label><textarea id="${id}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>${hint}</div>`;
    case "toggle": {const on=String(val||f.def||"YES").toUpperCase()!=="NO";return `<label class="toggle"><input type="checkbox" id="${id}" ${on?"checked":""}> ${f.l}</label>${hint}`;}
    case "date0": return `<div class="field"><label for="${id}">${f.l}</label><input type="date" id="${id}" value="${val?isoDay(val):""}">${hint}</div>`;
    case "date": return `<div class="field"><label for="${id}">${f.l}</label><input type="date" id="${id}" value="${isoDay(val)}"></div>`;
    case "number": return `<div class="field"><label for="${id}">${f.l}</label><input type="number" id="${id}" min="1" value="${esc(val)}" placeholder="${esc(f.ph||"")}">${hint}</div>`;
    case "image": return `<div class="field"><span class="lbl">${f.l}</span><div class="media">
        <div class="prev" id="${id}_prev">${val?`<img src="${esc(val)}" alt="" onerror="imgFallback(this)">`:"No picture yet"}</div>
        <div style="display:grid;gap:10px;min-width:0">
          <div class="up"><label class="btn b-cyan" for="${id}_file">Upload picture</label><input type="file" id="${id}_file" accept="image/*" data-up="${f.k}" data-kind="image">
          ${val?`<button type="button" class="btn b-line" data-clear="${f.k}">Remove</button>`:""}<span class="prog" id="${id}_prog"></span></div>
          <input type="url" id="${id}" value="${esc(val)}" placeholder="…or paste a picture link" aria-label="${f.l} link">
          <span class="hint">Pictures are made smaller automatically so the site loads fast on phone data.</span></div></div></div>`;
    case "video": return `<div class="field"><label for="${id}">${f.l}</label>
        <input type="url" id="${id}" value="${esc(val)}" placeholder="Paste a YouTube, Facebook or TikTok link">
        <div class="up"><label class="btn b-line" for="${id}_file">…or upload a video file</label><input type="file" id="${id}_file" accept="video/*" data-up="${f.k}" data-kind="video"><span class="prog" id="${id}_prog"></span></div>
        <span class="hint">Best: upload long videos to YouTube and paste the link. Direct uploads are limited to 25 MB (about 1 minute).</span></div>`;
    case "file": return `<div class="field"><label for="${id}">${f.l}</label>
        <input type="url" id="${id}" value="${esc(val)}" placeholder="${esc(f.ph||"https://…")}">
        <div class="up"><label class="btn b-line" for="${id}_file">…or upload a file (PDF, Word, Excel)</label><input type="file" id="${id}_file" data-up="${f.k}" data-kind="file"><span class="prog" id="${id}_prog"></span></div>
        <span class="hint">Google Drive links: Share → “Anyone with the link” → Copy link.</span></div>`;
    case "target": {
      const opts=[["","A web link (type it below), or no button"],["section:apps","Apps & Software section"],["section:design","Design & Print section"],["section:resources","Teacher Resources section"],["section:news","News & Updates section"],["section:comments","Comments section"],["section:contact","Contact section"]]
        .concat((APP_LIST||[]).map(a=>["app:"+a.id,"App: "+a.title]));
      if(val&&!opts.some(o=>o[0]===val))opts.push([val,"(removed item)"]);
      return `<div class="field"><label for="${id}">${f.l}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?"selected":""}>${esc(o[1])}</option>`).join("")}</select>${hint}</div>`;}
    default: return `<div class="field"><label for="${id}">${f.l}</label><input type="${f.t==="url"?"url":"text"}" id="${id}" value="${esc(val)}" placeholder="${esc(f.ph||"")}">${hint}</div>`;
  }
}
let editing=null,APP_LIST=null;
async function edit(r){
  if((cur.key==="Posts"||cur.key==="Chat")&&!APP_LIST){try{const j=await api("adminList",{tab:"Apps"});APP_LIST=(j.rows||[]).filter(a=>String(a.show).toUpperCase()!=="NO").map(a=>({id:String(a.id),title:a.title,image:a.image}));}catch(e){APP_LIST=[];}}
  editing=r;window.scrollTo(0,0);
  const isNew=!r.id;
  main.innerHTML=`<div class="head"><h2>${isNew?"Add new":"Edit"} · ${cur.label}</h2><button class="btn b-line" type="button" id="back">← Back to list</button></div>
   <form class="editor" id="ed" novalidate>${cur.fields.map(f=>fieldHTML(f,r[f.k])).join("")}
   <div class="foot"><button class="btn b-main" type="submit" id="saveBtn">${isNew?"Publish":"Save changes"}</button><button class="btn b-line" type="button" id="cancel">Cancel</button></div></form>`;
  $("#back").onclick=$("#cancel").onclick=()=>drawList();
  $("#ed").addEventListener("submit",save);
  main.querySelectorAll("[data-up]").forEach(inp=>inp.addEventListener("change",()=>uploadField(inp)));
  main.querySelectorAll("[data-clear]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.clear;$("#f_"+k).value="";$("#f_"+k+"_prev").textContent="No picture yet";b.remove();}));
  cur.fields.filter(f=>f.t==="image").forEach(f=>$("#f_"+f.k).addEventListener("change",e=>{const v=e.target.value.trim();$("#f_"+f.k+"_prev").innerHTML=v?`<img src="${esc(v)}" alt="" onerror="imgFallback(this)">`:"No picture yet";}));
}
let uploading=0;
async function uploadField(inp){
  const file=inp.files[0];if(!file)return;
  const k=inp.dataset.up,kind=inp.dataset.kind,prog=$("#f_"+k+"_prog");
  try{
    uploading++;prog.textContent="Preparing…";
    let blob=file,name=file.name;
    if(kind==="image"&&/^image\/(jpeg|png|webp|heic|heif|bmp)/.test(file.type)){blob=await shrink(file);name=name.replace(/\.\w+$/,"")+".jpg";}
    if(blob.size>25*1024*1024)throw new Error(ERR.file_too_big);
    prog.textContent=`Uploading ${(blob.size/1048576).toFixed(1)} MB…`;
    const data=await toB64(blob);
    const j=await api("upload",{name,type:blob.type||file.type||"application/octet-stream",data});
    $("#f_"+k).value=j.url;
    if(kind==="image")$("#f_"+k+"_prev").innerHTML=`<img src="${esc(j.url)}" alt="" onerror="imgFallback(this)">`;
    prog.textContent="Uploaded ✓";
  }catch(err){prog.textContent="";toast(err.message);}
  finally{uploading--;inp.value="";}
}
function toB64(blob){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=()=>no(new Error("Could not read the file."));fr.readAsDataURL(blob);});}
function shrink(file){
  return new Promise(ok=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      c.toBlob(b=>{URL.revokeObjectURL(url);ok(b&&b.size<file.size?b:file);},"image/jpeg",0.82);};
    img.onerror=()=>{URL.revokeObjectURL(url);ok(file);};
    img.src=url;
  });
}
/* After publishing: ask the public feed (what visitors get) whether the post is in it */
async function liveCheck(id){
  const el=$("#liveCheck");if(!el)return;
  try{
    const res=await fetch(API_URL+"?action=content&t="+Date.now(),{cache:"no-store"});
    const j=await res.json();
    const found=(j.posts||[]).some(p=>String(p.id)===String(id));
    if(found){el.className="live ok";el.innerHTML="✓ Checked: the public website feed has this post. If your site still doesn’t show it: (1) make sure <b>API_URL in index.html</b> is the same link as in admin.html, and (2) close the website tab and open it again (phones keep an old copy).";}
    else{el.className="live bad";el.innerHTML="⚠ Saved in your Google Sheet, but the public feed does not include it yet. This usually means Code.gs was changed without publishing: in Apps Script go to <b>Deploy → Manage deployments → ✏ → Version: New version → Deploy</b>.";}
  }catch(e){el.className="live bad";el.textContent="⚠ Could not reach the public feed. Check the deployment has “Who has access: Anyone”.";}
}
async function save(e){
  e.preventDefault();
  if(uploading){toast("Please wait for the upload to finish.");return;}
  const item={id:editing.id||""};
  for(const f of cur.fields){
    const el=$("#f_"+f.k);
    let v=f.t==="toggle"?(el.checked?"YES":"NO"):el.value.trim();
    if(f.req&&!v){toast(`Please fill in “${f.l}”.`);el.focus();return;}
    if((f.t==="url"||f.t==="file"||f.t==="image"||f.t==="video")&&v&&!/^https?:\/\//i.test(v)){toast(`“${f.l}” must start with https://`);el.focus();return;}
    if((f.t==="date"||f.t==="date0")&&v)v=new Date(v+"T12:00:00").toISOString();
    item[f.k]=v;
  }
  const b=$("#saveBtn");b.disabled=true;b.textContent="Saving…";
  try{
    const j=await api("save",{tab:cur.key,item});
    const i=rows.findIndex(r=>String(r.id)===String(j.item.id));
    if(i>=0)rows[i]=j.item;else rows.unshift(j.item);
    toast(item.show==="NO"?"Saved (hidden from website)":"Saved. It's live on the website.");drawList();
    if(cur.key==="Posts"&&item.show!=="NO"){
      const url=postLink(j.item.id);
      const app=String(j.item.target||"").startsWith("app:")?(APP_LIST||[]).find(a=>"app:"+a.id===j.item.target):null;
      const pic=j.item.image||(app&&app.image)||"";
      main.insertAdjacentHTML("afterbegin",`<div class="done">${pic?`<img class="done-img" src="${esc(pic)}" alt="" onerror="imgFallback(this)">`:""}<p style="margin:0"><b>${ico("check")} Published</b> in <b>${esc(j.item.place||"News & Updates")}</b>${String(j.item.pin).toUpperCase()==="YES"?" and the orange top bar":""}.</p>
        <div class="up"><a class="btn b-cyan" href="${esc(url)}" target="_blank" rel="noopener">See it on the website ↗</a><button class="btn b-line" type="button" data-copylink="${esc(url)}">${ico("link")} Copy link to share</button></div>
        <span class="hint">The link opens your site, scrolls to this post and shows a “Tap here” pointer.</span>
        <span class="live" id="liveCheck">Checking that visitors can see it…</span></div>`);
      liveCheck(j.item.id);
      window.scrollTo(0,0);
    }
  }catch(err){toast(err.message);b.disabled=false;b.textContent="Try again";}
}

/* ---------------- settings ---------------- */
function drawSettings(s){
  main.innerHTML=`<div class="head"><h2>${cur.title}</h2></div><p class="help">${cur.help}</p>
   <form class="editor" id="setForm" novalidate>
   ${SETTINGS.map((g,i)=>`<div class="${i?"group":""}" style="display:grid;gap:14px"><h3>${g.g}</h3>${g.f.map(f=>fieldHTML({...f,t:f.t||"text"},s[f.k])).join("")}${g.news?newsBox():""}</div>`).join("")}
   <div class="foot"><button class="btn b-main" type="submit" id="setSave">Save settings</button></div></form>`;
  $("#setForm").addEventListener("submit",async e=>{
    e.preventDefault();const values={};
    for(const g of SETTINGS)for(const f of g.f){const v=$("#f_"+f.k).value.trim();
      if(f.t==="url"&&v&&!/^https?:\/\//i.test(v)){toast(`“${f.l}” must start with https://`);$("#f_"+f.k).focus();return;}
      values[f.k]=v;}
    const b=$("#setSave");b.disabled=true;b.textContent="Saving…";
    try{await api("settingsSave",{values});toast("Settings saved. Refresh the website to see them.");}
    catch(err){toast(err.message);}
    b.disabled=false;b.textContent="Save settings";
  });
}

if(!API_URL.startsWith("https://script.google.com/")){
  $("#loginErr").textContent="Setup needed: paste your Apps Script link into API_URL at the top of admin.html.";
}else if(PW){api("login").then(start).catch(()=>logout());}
